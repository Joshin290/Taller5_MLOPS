services:
  inference_api:
    image: joshin290/penguins-api:latest
    # container_name: taller5_inference_api
    restart: unless-stopped
    expose:
      - "8010" # Expone el puerto solo internamente para Nginx
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'  # Limita a 1 CPU
          memory: '1G' # Limita a 1 GB de RAM

  nginx:
    image: nginx:alpine
    container_name: nginx_balancer
    ports:
      - "8000:8000" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - inference_api